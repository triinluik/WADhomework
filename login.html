<!DOCTYPE html>
<html lang="en"> <!-- inglise keeles -->
<head>
    <meta charset="UTF-8"> <!-- kuvab täpitähed ja erimärgid -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobiilivaade -->
    <title>PostIt – Log in</title>
    <link rel="stylesheet" href="style.css"> <!-- ühendab lehe css failiga -->
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">addPost</a>
        </nav>
        <a class="avatar" href="login.html">
            <img src="images/avatar.svg" alt="User profile">
        </a>
    </header>

    <main class="center">
        <section class="form-box">
            <h1>Welcome to PostIt</h1>

            <!-- href="#" on kohatäide, sest konto loomise lehte ülesanne ei nõua -->
            <a class="link" href="#">Create an account</a>
            <p>or<br>Please log in</p>

            <!-- action="index.html": pärast sisselogimist suunatakse pealehele -->
            <form action="index.html" method="get">

                <!-- required: brauser ei lase vormi saata, kui väli on tühi.
                     type="email": brauser kontrollib ka, et sisestus oleks e-posti kujul.
                     Nähtavat silti pole (nagu joonisel), aria-label annab ekraanilugejale välja nime. -->
                <input type="email" name="email" placeholder="Email" aria-label="Email" required>

                <!-- type="password": sisestatud tähed kuvatakse punktidena -->
                <input type="password" name="password" placeholder="Password" aria-label="Password" required>

                <button type="submit">Log in</button>
            </form>

            <a class="link" href="#">Forget password</a>
        </section>
    </main>

</body>
</html>
