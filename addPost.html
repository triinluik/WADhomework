<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt – Add post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">addPost</a>
        </nav>
        <a class="avatar" href="login.html">
            <img src="images/tundmatu.jpg" alt="User profile">
        </a>
    </header>

    <main class="center">
        <section class="form-box">
            
            <form action="index.html" method="get">

                <!-- label for="..." seob sildi väljaga sama id kaudu.
                     Sildile klõpsates läheb fookus välja sisse. -->
                <div class="form-row">
                    <label for="body">Post body</label>
                    <textarea id="body" name="body" placeholder="textarea"></textarea>
                </div>

                <!-- type="file" loob faili valimise nupu (Choose File) -->
                <div class="form-row">
                    <label for="file">Select file</label>
                    <input type="file" id="file" name="file">
                </div>

                <!-- type="submit" saadab vormi ehk suunab index.html lehele -->
                <button type="submit">Create post</button>
            </form>
        </section>
    </main>

</body>
</html>
