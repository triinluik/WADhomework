<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta charset: täpitähed ja erimärgid kuvatakse õigesti -->
    <meta charset="UTF-8">
    <!-- viewport: vajalik, et lehte näitaks telefonis õigesti -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt – Home</title>
    <!-- Ühendame ühise CSS-faili -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header>
        <!-- <nav> tähistab navigatsiooni. Lingid viivad teistele lehtedele. -->
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">addPost</a>
        </nav>
        <!-- Avatarile vajutades avaneb kasutaja menüü -->
        <div class="avatar">
            <img id="avatar-btn" src="images/tundmatu.jpg" alt="User profile">
            <div id="user-menu" class="dropdown hidden">
                <p>Liisi Valdvee</p>
                <p>liisi.valdvee@ut.ee</p>
                <a href="login.html">logout</a>
            </div>
        </div>
    </header>

    <!-- <main> sisaldab lehe põhisisu -->
    <main class="layout">

        <!-- <aside> on kõrvalsisu (külgriba) -->
        <aside></aside>

        <!-- Postituste veerg. Iga postitus on eraldi <article>,
             sest see on iseseisev sisuüksus. -->
        <section class="posts" id = "posts-container">
            <!-- Posts are now dynamically generated by posts.js -->
        </section>

        <aside></aside>
    </main>

    <!-- <footer> on lehe jalus -->
    <footer>
        <p>Footer</p>
    </footer>
    <script src="posts.js"></script>
</body>
</html>
